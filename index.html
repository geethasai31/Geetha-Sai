<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rajana Geetha Sai — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF8FC;
    --ink: #2E2A3D;
    --muted: #837D97;
    --lavender: #C9BBEA; --lavender-deep:#8A72C2;
    --blush: #F6BACB; --blush-deep:#DE7B98;
    --mint: #B3E6D8; --mint-deep:#4FA98C;
    --butter: #F7D89A; --butter-deep:#D9A233;
    --sky: #B7DCF2; --sky-deep:#4F93C4;
    --card-border: rgba(46,42,61,0.08);
    --radius: 22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  ::selection{background:var(--blush);color:#2E2A3D;}
  :focus-visible{outline:2px solid var(--lavender-deep);outline-offset:3px;}
  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease, transform .6s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  .grad-text{background:linear-gradient(100deg,var(--lavender-deep),var(--blush-deep),var(--mint-deep));-webkit-background-clip:text;background-clip:text;color:transparent;}

  nav{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:100;
    background:rgba(255,255,255,0.75);backdrop-filter:blur(16px);border:1px solid var(--card-border);
    border-radius:100px;padding:8px 10px;display:flex;gap:2px;box-shadow:0 10px 30px -14px rgba(46,42,61,0.25);}
  nav a{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:9px 16px;border-radius:100px;transition:all .2s;white-space:nowrap;}
  nav a:hover{background:var(--lavender);color:var(--ink);}
  @media (max-width:820px){nav{display:none;}}

  /* HERO */
  .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:140px 32px 60px;overflow:hidden;}
  .blob-bg{position:absolute;inset:0;z-index:0;pointer-events:none;filter:blur(4px);}
  .blob-bg span{position:absolute;border-radius:50%;opacity:0.28;filter:blur(60px);}
  .bl1{width:460px;height:460px;background:var(--lavender);top:-120px;right:-100px;animation:drift1 24s ease-in-out infinite;}
  .bl2{width:380px;height:380px;background:var(--blush);bottom:-100px;left:-80px;animation:drift2 28s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(-40px,50px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(50px,-30px);}}

  .hero-grid{max-width:1180px;margin:0 auto;position:relative;z-index:2;display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  @media (max-width:820px){.hero-grid{grid-template-columns:1fr;}}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mint-deep);letter-spacing:0.07em;text-transform:uppercase;
    display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 10px;border-radius:100px;
    background:rgba(79,169,140,0.10);border:1px solid rgba(79,169,140,0.3);margin-bottom:26px;
  }
  .eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--mint-deep);}
  .hero h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(40px,5.6vw,72px);line-height:1.03;letter-spacing:-0.02em;color:var(--ink);}
  .hero .role{font-family:'Fraunces',serif;font-size:18px;font-style:italic;color:var(--muted);margin-top:18px;}
  .hero .bio{margin-top:18px;font-size:15px;color:var(--muted);max-width:52ch;}
  .hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px;}
  .btn{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:13px 22px;border-radius:100px;
    display:inline-flex;align-items:center;gap:8px;transition:transform .2s, box-shadow .2s;
  }
  .btn-fill{background:var(--ink);color:#FBF8FC;box-shadow:0 10px 24px -10px rgba(46,42,61,0.5);}
  .btn-fill:hover{transform:translateY(-2px);}
  .btn-line{border:1px solid var(--card-border);background:rgba(255,255,255,0.6);}
  .btn-line:hover{border-color:var(--blush-deep);transform:translateY(-2px);}

  .hero-photo-wrap{position:relative;}
  .blob-photo{
    width:100%;max-width:360px;aspect-ratio:1;margin:0 auto;position:relative;
    border-radius:44% 56% 60% 40% / 45% 40% 60% 55%;overflow:hidden;
    border:6px solid #fff;box-shadow:0 30px 60px -24px rgba(46,42,61,0.35);
    animation:morph 12s ease-in-out infinite;
  }
  @keyframes morph{
    0%,100%{border-radius:44% 56% 60% 40% / 45% 40% 60% 55%;}
    50%{border-radius:58% 42% 40% 60% / 55% 60% 40% 45%;}
  }
  .blob-photo img{width:100%;height:100%;object-fit:cover;object-position:center top;}
  .photo-badge{
    position:absolute;bottom:6px;right:6px;background:#fff;border-radius:100px;padding:9px 16px;
    font-family:'JetBrains Mono',monospace;font-size:11.5px;box-shadow:0 10px 24px -10px rgba(46,42,61,0.3);
    display:flex;align-items:center;gap:6px;
  }
  .photo-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--mint-deep);animation:pulse 2s infinite;}

  /* MARQUEE */
  .marquee-band{position:relative;z-index:2;border-top:1px solid var(--card-border);border-bottom:1px solid var(--card-border);
    padding:20px 0;overflow:hidden;background:rgba(255,255,255,0.5);}
  .marquee-track{display:flex;gap:40px;white-space:nowrap;animation:scroll-left 26s linear infinite;width:max-content;}
  .marquee-track span{font-family:'Fraunces',serif;font-style:italic;font-size:20px;color:var(--muted);display:flex;align-items:center;gap:40px;}
  .marquee-track span::after{content:'✦';color:var(--blush-deep);font-style:normal;font-size:14px;}
  @keyframes scroll-left{from{transform:translateX(0);}to{transform:translateX(-50%);}}

  .bento-wrap{max-width:1180px;margin:0 auto;padding:28px 32px 100px;}
  .bento-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(140px,auto);gap:18px;}
  @media (max-width:920px){.bento-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.bento-grid{grid-template-columns:1fr;}}

  .card{
    background:#fff;border:1px solid var(--card-border);border-radius:var(--radius);padding:26px;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
    box-shadow:0 10px 28px -18px rgba(46,42,61,0.25);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 34px -16px rgba(46,42,61,0.3);}
  .c1{grid-column:span 1;} .c2{grid-column:span 2;} .c3{grid-column:span 3;} .c4{grid-column:span 4;}
  .r1{grid-row:span 1;} .r2{grid-row:span 2;} .r3{grid-row:span 3;}
  @media (max-width:920px){.c3{grid-column:span 2;} .c4{grid-column:span 2;}}
  @media (max-width:560px){.card{grid-column:span 1 !important;grid-row:span 1 !important;}}

  .tint-lavender{background:linear-gradient(160deg,rgba(201,187,234,0.35),#fff 65%);}
  .tint-blush{background:linear-gradient(160deg,rgba(246,186,203,0.35),#fff 65%);}
  .tint-mint{background:linear-gradient(160deg,rgba(179,230,216,0.4),#fff 65%);}
  .tint-butter{background:linear-gradient(160deg,rgba(247,216,154,0.4),#fff 65%);}
  .tint-sky{background:linear-gradient(160deg,rgba(183,220,242,0.4),#fff 65%);}
  .tint-dark{background:var(--ink);color:#F3F0FA;}
  .tint-dark .muted-c{color:#C9C3DA;}

  /* BIO CARD */
  .bio-card h4, .card h4{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:12px;}
  .bio-card p{font-size:14.5px;color:var(--ink);}

  /* STAT CARD */
  .stat-card{justify-content:center;align-items:flex-start;}
  .stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:36px;font-weight:700;}
  .stat-card .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:6px;}
  .live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mint-deep);margin-left:5px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  /* CONTACT PILLS CARD */
  .pill-list{display:flex;flex-direction:column;gap:8px;margin-top:auto;}
  .pill{font-family:'JetBrains Mono',monospace;font-size:12px;padding:8px 12px;border-radius:10px;background:rgba(46,42,61,0.04);border:1px solid var(--card-border);display:flex;align-items:center;gap:8px;transition:background .15s;}
  .pill:hover{background:rgba(222,123,152,0.12);}

  /* QUOTE CARD */
  .quote-card{justify-content:center;}
  .quote-card p{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:500;line-height:1.5;}

  /* TIMELINE CARD */
  .t-item{padding-bottom:16px;border-bottom:1px solid var(--card-border);margin-bottom:16px;}
  .t-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .t-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mint-deep);}
  .t-item h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;margin-top:4px;}
  .t-item .place{font-size:13px;color:var(--muted);margin-top:2px;}
  .t-item .score{display:inline-block;margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:11.5px;background:rgba(138,114,194,0.12);border:1px solid rgba(138,114,194,0.3);padding:4px 10px;border-radius:100px;color:var(--lavender-deep);}

  /* SKILLS CARD */
  .tag-cloud{display:flex;flex-wrap:wrap;gap:7px;margin-top:auto;}
  .tag{font-size:12.5px;padding:6px 11px;border-radius:8px;background:rgba(46,42,61,0.05);border:1px solid var(--card-border);}

  /* DESIGN CARD */
  .design-icon{font-size:26px;margin-bottom:10px;}
  .design-card h3{font-family:'Space Grotesk',sans-serif;font-size:16.5px;font-weight:600;margin-bottom:6px;}
  .design-card p{font-size:13px;color:var(--muted);}

  /* PROJECT CARD */
  .project-card .p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .project-card h3{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;}
  .project-tag{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:linear-gradient(100deg,var(--mint),var(--lavender));border-radius:100px;padding:4px 10px;font-weight:700;color:#2E2A3D;white-space:nowrap;}
  .project-card p.desc{font-size:13.5px;color:var(--muted);margin-top:8px;}
  .project-card ul{margin:10px 0 0 16px;font-size:13.5px;color:var(--muted);}
  .project-card ul li{margin-bottom:4px;}
  .tech-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
  .tech{font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(46,42,61,0.05);padding:4px 9px;border-radius:6px;border:1px solid var(--card-border);}
  .project-card .repo-link{margin-top:12px;font-size:12.5px;color:var(--mint-deep);}

  /* GITHUB LIVE CARD */
  .gh-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:14px;}
  .gh-status .dot{width:6px;height:6px;border-radius:50%;background:var(--mint-deep);animation:pulse 2s infinite;}
  .gh-mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .gh-mini{border:1px solid var(--card-border);border-radius:12px;padding:12px;background:rgba(46,42,61,0.02);cursor:pointer;transition:background .15s;}
  .gh-mini:hover{background:rgba(222,123,152,0.1);}
  .gh-mini .gh-name{font-family:'Space Grotesk',sans-serif;font-size:13.5px;font-weight:600;}
  .gh-mini .gh-meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);margin-top:6px;}

  /* LEADERSHIP CARD */
  .role-card h3{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;}
  .role-card .r-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mint-deep);margin-top:4px;}
  .role-card ul{margin:10px 0 0 16px;font-size:13px;color:var(--muted);}
  .role-card ul li{margin-bottom:4px;}

  /* ACHIEVEMENT / CERT CARD */
  .achieve-list{list-style:none;margin-top:auto;}
  .achieve-list li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--card-border);font-size:13.5px;}
  .achieve-list li:first-child{border-top:none;padding-top:0;}
  .a-mark{color:var(--butter-deep);font-family:'JetBrains Mono',monospace;}
  .cert-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .cert{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:100px;border:1px solid var(--card-border);color:var(--muted);}
  .cert.done{border-color:var(--mint-deep);color:var(--mint-deep);background:rgba(179,230,216,0.2);}
  .cert.pending{border-color:var(--butter-deep);color:var(--butter-deep);background:rgba(247,216,154,0.25);}

  /* CONTACT CTA CARD */
  .cta-card h2{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,3vw,32px);font-weight:700;}
  .cta-card p{color:var(--muted-c,var(--muted));font-size:13.5px;margin-top:10px;max-width:44ch;}
  .cta-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;}
  .cta-links a{font-family:'JetBrains Mono',monospace;font-size:12.5px;padding:9px 14px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);display:inline-flex;align-items:center;gap:6px;}
  .tint-dark .cta-links a:hover{background:rgba(255,255,255,0.16);}

  footer{padding:28px 0;text-align:center;color:var(--muted);font-size:12.5px;font-family:'JetBrains Mono',monospace;}
</style>
</head>

function el(tag, className, html){
  const e = document.createElement(tag);
  if(className) e.className = className;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function card(classes){ return el('div', 'card ' + classes); }

function render(){
  const bento = document.getElementById('bento');

  // 1. Bio card
  const bio = card('c2 r1 tint-lavender bio-card');
  bio.id = 'about';
  bio.innerHTML = `<h4>About</h4><p>${CONFIG.bio}</p>`;
  bento.appendChild(bio);

  // 2. Stats cards
  CONFIG.stats.forEach(s => {
    const sc = card(`c1 r1 ${s.tint} stat-card`);
    sc.innerHTML = `<div class="num" ${s.live ? `data-key="${s.key}"` : ''}>${s.num}</div><div class="lbl">${s.label}${s.live ? ' <span class="live-dot"></span>' : ''}</div>`;
    bento.appendChild(sc);
  });

  // 3. Quote card
  const quote = card('c2 r1 tint-sky quote-card');
  quote.innerHTML = `<p>${CONFIG.quote}</p>`;
  bento.appendChild(quote);

  // 6. Education card
  const edu = card('c2 r2');
  edu.id = 'education';
  let eduHtml = '<h4>Education</h4>';
  CONFIG.education.forEach(item => {
    eduHtml += `<div class="t-item"><div class="t-time">${item.time}</div><h3>${item.school}</h3><div class="place">${item.detail}</div><span class="score">${item.score}</span></div>`;
  });
  edu.innerHTML = eduHtml;
  bento.appendChild(edu);

  // 7. Skills cards
  Object.entries(CONFIG.skills).forEach(([group, data], idx) => {
    const sk = card(`c1 r1 ${data.tint}`);
    if(idx === 0) sk.id = 'skills';
    const tags = data.items.map(i => `<span class="tag">${i}</span>`).join('');
    sk.innerHTML = `<h4>${group}</h4><div class="tag-cloud">${tags}</div>`;
    bento.appendChild(sk);
  });

  // 8. Design cards
  CONFIG.design.cards.forEach((c, idx) => {
    const dc = card(`c1 r1 ${c.tint} design-card`);
    if(idx === 0) dc.id = 'design';
    dc.innerHTML = `<div class="design-icon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p>`;
    bento.appendChild(dc);
  });
  const designNote = card('c4 r1 tint-dark');
  designNote.innerHTML = `<h4 style="color:#C9C3DA;">Go-to tool</h4><p style="font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:500;">${CONFIG.design.intro}</p>`;
  bento.appendChild(designNote);

  // 9. Project cards
  CONFIG.projects.forEach((p, idx) => {
    const pc = card(`${p.size} r1 ${p.tint} project-card`);
    if(idx === 0) pc.id = 'projects';
    const bullets = p.bullets.map(b => `<li>${b}</li>`).join('');
    const techs = p.tech.map(t => `<span class="tech">${t}</span>`).join('');
    const repoLink = p.repo ? `<div class="repo-link"><a href="https://github.com/${CONFIG.contact.githubUsername}/${p.repo}" target="_blank" rel="noopener">View repository ↗</a></div>` : '';
    pc.innerHTML = `
      <div class="p-top"><h3>${p.title}</h3><span class="project-tag">${p.tag}</span></div>
      <p class="desc">${p.desc}</p>
      ${bullets ? `<ul>${bullets}</ul>` : ''}
      <div class="tech-row">${techs}</div>
      ${repoLink}`;
    bento.appendChild(pc);
  });

  // 10. GitHub live card
  const ghCard = card('c4 r1');
  ghCard.innerHTML = `
    <h4>More from GitHub</h4>
    <div class="gh-status"><span class="dot"></span><span id="js-gh-status">Fetching live repositories…</span></div>
    <div class="gh-mini-grid" id="js-gh-grid"></div>`;
  bento.appendChild(ghCard);

  // 11. Leadership cards
  CONFIG.leadership.forEach((r, idx) => {
    const lc = card(`c1 r1 ${r.tint} role-card`);
    if(idx === 0) lc.id = 'leadership';
    const bullets = r.bullets.map(b => `<li>${b}</li>`).join('');
    lc.innerHTML = `<h3>${r.title}</h3><div class="r-time">${r.time}</div>${bullets ? `<ul>${bullets}</ul>` : ''}`;
    bento.appendChild(lc);
  });

  // 12. Achievements card
  const ach = card('c1 r2');
  let achHtml = '<h4>Achievements</h4><ul class="achieve-list">';
  CONFIG.achievements.forEach(a => achHtml += `<li><span class="a-mark">★</span>${a}</li>`);
  achHtml += '</ul>';
  let certHtml = '<div class="cert-row">';
  CONFIG.certifications.forEach(c => {
    const mark = c.status === 'done' ? '✓' : '◐';
    certHtml += `<span class="cert ${c.status}">${mark} ${c.label}</span>`;
  });
  certHtml += '</div>';
  ach.innerHTML = achHtml + certHtml;
  bento.appendChild(ach);

  // 13. Contact CTA card
  const cta = card('c3 r1 tint-dark');
  cta.id = 'contact';
  const ctaLinks = [
    { href: `mailto:${CONFIG.contact.email}`, label: CONFIG.contact.email },
    { href: `tel:${CONFIG.contact.phoneHref}`, label: CONFIG.contact.phone },
    { href: CONFIG.contact.linkedin, label: 'LinkedIn ↗', ext:true },
    { href: CONFIG.contact.github, label: 'GitHub ↗', ext:true }
  ].map(l => `<a href="${l.href}" ${l.ext ? 'target="_blank" rel="noopener"' : ''}>${l.label}</a>`).join('');
  cta.innerHTML = `
    <h2>Let's build something <span class="grad-text">together</span>.</h2>
    <p class="muted-c">${CONFIG.contactNote}</p>
    <div class="cta-links">${ctaLinks}</div>`;
  bento.appendChild(cta);

  // reveal animation
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); } });
  }, {threshold:0.1});
  document.querySelectorAll('.card').forEach(c => { c.classList.add('reveal'); observer.observe(c); });
  document.querySelectorAll('.hero .reveal').forEach(c => observer.observe(c));
}

async function fetchGithubLive(){
  const username = CONFIG.contact.githubUsername;
  const statusEl = document.getElementById('js-gh-status');
  const gridEl = document.getElementById('js-gh-grid');
  const featuredRepoNames = CONFIG.projects.filter(p => p.repo).map(p => p.repo.toLowerCase());

  try {
    const [userRes, reposRes] = await Promise.all([
      fetch(`https://api.github.com/users/${username}`),
      fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`)
    ]);
    if(!userRes.ok || !reposRes.ok) throw new Error('GitHub API request failed');
    const user = await userRes.json();
    const repos = await reposRes.json();

    const liveStat = document.querySelector('.num[data-key="public_repos"]');
    if(liveStat) liveStat.textContent = user.public_repos ?? '—';

    const others = repos
      .filter(r => !featuredRepoNames.includes(r.name.toLowerCase()) && !r.fork)
      .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

    if(others.length === 0){
      statusEl.textContent = 'All public repositories are featured above';
      return;
    }
    statusEl.textContent = `Live · ${others.length} more repositor${others.length===1?'y':'ies'} on GitHub`;
    others.forEach(r => {
      const mini = el('div', 'gh-mini');
      const updated = new Date(r.updated_at).toLocaleDateString('en-IN', { month:'short', year:'numeric' });
      mini.innerHTML = `<div class="gh-name">${r.name}</div><div class="gh-meta">${r.language ? r.language : '—'} · ★ ${r.stargazers_count} · ${updated}</div>`;
      mini.addEventListener('click', () => window.open(r.html_url, '_blank', 'noopener'));
      gridEl.appendChild(mini);
    });
  } catch(err){
    statusEl.textContent = 'Live GitHub data unavailable right now — showing featured projects only';
  }
}

function renderHero(){
  document.getElementById('js-eyebrow').textContent = CONFIG.tagline;
  document.getElementById('js-name-span').textContent = CONFIG.name;
  document.getElementById('js-role').textContent = CONFIG.role.replace(/&amp;/g, '&');
  document.getElementById('js-bio').textContent = CONFIG.bio;
  document.getElementById('js-photo').src = CONFIG.photoBase64;
  document.getElementById('js-photo').alt = CONFIG.name;
  document.getElementById('js-cta-mail').href = `mailto:${CONFIG.contact.email}`;
  document.getElementById('js-cta-github').href = CONFIG.contact.github;

  const mq = document.getElementById('js-marquee');
  mq.innerHTML = [...CONFIG.marquee, ...CONFIG.marquee].map(m => `<span>${m}</span>`).join('');
}

renderHero();
render();
fetchGithubLive();
</script>
